name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: storexa_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STOREXA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storexa_test
      STOREXA_TEST_SECOND_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storexa_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo check --examples
      - run: cargo test --test postgres_integration -- --ignored
      - run: cargo package
