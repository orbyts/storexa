[package]
name = "storexa"
version = "0.0.3"
edition = "2024"
rust-version = "1.94"
description = "A clean, domain-agnostic persistence foundation for Rust applications."
license = "MIT"
repository = "https://github.com/orbyts/storexa"
readme = "README.md"
keywords = ["database", "persistence", "postgresql", "sqlx"]
categories = ["database"]

[dependencies]
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
thiserror = "2.0.17"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
